name: karma
description: "Karma - AI-Powered Personal Growth & Virtue Tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  icons_plus: ^5.0.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Charts
  fl_chart: ^0.70.2

  # Voice
  speech_to_text: ^7.0.0
  permission_handler: ^11.4.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_dotenv: ^5.2.1
  timeago: ^3.7.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - .env
